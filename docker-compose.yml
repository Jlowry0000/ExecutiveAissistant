# =============================================================================
# AI Executive Assistant - Docker Compose Configuration
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - State & Context Store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: exec-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exec_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-exec_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
    networks:
      - exec-assistant-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exec_assistant} -d ${POSTGRES_DB:-exec_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # NocoDB - Database UI & API
  # ---------------------------------------------------------------------------
  nocodb:
    image: nocodb/nocodb:0.255.0
    container_name: exec-assistant-nocodb
    restart: unless-stopped
    environment:
      NC_DB: pg://${POSTGRES_USER:-exec_assistant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exec_assistant}?u=${POSTGRES_USER:-exec_assistant}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB:-exec_assistant}
      NC_PORT: ${NOCODB_PORT:-8080}
      NC_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_AUTH_JWT_SECRET: ${NOCODB_ADMIN_JWT_SECRET}
      NC_AUTH_EMAIL: admin@exec-assistant.local
      NC_AUTH_PASSWORD: ${NOCODB_ADMIN_PASSWORD}
      NC_AUTH_FIRSTNAME: Admin
      NC_AUTH_LASTNAME: User
      NC_DB_TYPE: postgres
    volumes:
      - nocodb_data:/usr/src/app/data
    networks:
      - exec-assistant-net
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # n8n - Orchestration Layer (Workflow Engine)
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:1.70.0
    container_name: exec-assistant-n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/New_York}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_LOG_LEVEL=info
      - N8N_API_KEY=${N8N_API_KEY}
      - DIGEST_EMAIL_TO=${DIGEST_EMAIL_TO}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-exec_assistant}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-exec_assistant}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    networks:
      - exec-assistant-net
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # FastAPI - Webhook API Service
  # ---------------------------------------------------------------------------
  api:
    build: ./api
    container_name: exec-assistant-api
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-exec_assistant}
      - POSTGRES_USER=${POSTGRES_USER:-exec_assistant}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NOCODB_URL=http://nocodb:8080
      - API_KEY=${API_KEY}
      - N8N_API_KEY=${N8N_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-abab6-chat}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
    volumes:
      - ./api:/app
      - ./src:/app/src
    networks:
      - exec-assistant-net
    depends_on:
      - nocodb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # nginx - Reverse Proxy with TLS
  # ---------------------------------------------------------------------------
  nginx:
    build: ./reverse-proxy
    container_name: exec-assistant-nginx
    restart: unless-stopped
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - exec-assistant-net
    depends_on:
      - api
      - nocodb
      - n8n
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  nocodb_data:
  n8n_data:

networks:
  exec-assistant-net:
    driver: bridge
